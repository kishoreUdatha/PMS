# Pins the repository root as pytest's rootdir.
#
# Without this, running `pytest services/finance/tests/...` made pytest walk
# UP from the test file, find `services/finance/pyproject.toml`, and settle
# on `services/finance` as the rootdir. conftest files are collected from the
# rootdir downwards, so the root `conftest.py` -- which puts the services on
# the import path and points the tests at the database -- was never loaded.
#
# The effect was seventeen finance tests that skipped on every run and a
# suite that reported green for its whole life. A `pytest.ini` at the root
# takes precedence over any pyproject below it, which is the whole job of
# this file.
#
# Deliberately not a root pyproject.toml: `uv` reads those, and inventing a
# root package to configure a test runner would change how the workspace
# resolves for a reason that has nothing to do with packaging.

[pytest]
testpaths = services tests

# Skips are the failure mode this file exists to fix, so they are always
# summarised rather than collapsed into a count at the end of a green run.
addopts = -ra
