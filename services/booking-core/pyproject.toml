[project]
name = "chirala-booking-core"
version = "0.1.0"
description = "Booking-core service: property inventory, reservations, holds, room calendar."
requires-python = ">=3.12"
dependencies = [
    "chirala-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "redis>=5.0",
]

[tool.uv.sources]
chirala-common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["booking_core"]
