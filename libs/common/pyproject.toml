[project]
name = "chirala-common"
version = "0.1.0"
description = "Shared library for Chirala Bay PMS services: config, DB, tenant context, auth, outbox."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    # Declared outright, not leaned on as python-jose's extra. Tenant
    # payment credentials are sealed with Fernet from this package, and a
    # dependency that could disappear when another package changes its
    # extras is not something to keep those in.
    "cryptography>=42",
    "httpx>=0.27",
    # Rate limiting (chirala_common.ratelimit): the public booking API and
    # iam's sign-in routes count requests in the same Redis.
    "redis>=5.0",
    "boto3>=1.34",
    # Thumbnails. A room photograph is uploaded at whatever size the camera
    # produced -- a few megabytes is normal -- and a booking page that sends
    # three of those to a phone on hotel wifi is a booking page people leave.
    # Resizing happens once, on upload, rather than on every request.
    "pillow>=10.3",
    "structlog>=24.1",
    # The outbox relay. integration.outbox_events has been written to since
    # the first migration and never drained, because the relay its own
    # docstring describes was never built and there was no client to build it
    # with. NATS is already running in compose; this is the half that was
    # missing.
    "nats-py>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chirala_common"]
