<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyGuest is a cloud hotel management system: reservations, front desk, housekeeping, channel manager for Booking.com, Airbnb, Expedia and Agoda, a direct booking engine, billing and the night audit in one place." />
    <meta name="theme-color" content="#007A85" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The card a link shows when it is shared on WhatsApp, LinkedIn, Slack
         or X. og:image is relative here; most crawlers want an absolute URL,
         so make it https://<your domain>/og-image.png once the site has one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyGuest" />
    <meta property="og:title" content="MyGuest: run your whole property from one screen" />
    <meta property="og:description" content="Reservations, front desk, housekeeping, channel manager, booking engine and billing for hotels and resorts, in one system." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyGuest: run your whole property from one screen" />
    <meta name="twitter:description" content="Reservations, front desk, housekeeping, channel manager, booking engine and billing for hotels and resorts, in one system." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Replaced at runtime with the signed-in property's own name; see
         lib/brand.ts. A fixed hotel name here labelled every tenant's
         browser tab with the first customer's brand. -->
    <title>MyGuest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
