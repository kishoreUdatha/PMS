<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Book your stay</title>
<!--
  The guest-facing booking engine.

  Served from the gateway rather than bundled into the PMS frontend, for two
  reasons. The PMS bundle is the staff application -- shipping it to the public
  would send a hundred-odd screens and the whole auth layer to somebody who
  wants to book a room. And the gateway is the single public origin, so every
  call here is same-origin: no CORS, no second hostname to configure, and the
  tunnel that makes webhooks reachable makes this reachable too.

  Deliberately one file of plain JavaScript. The flow is four linear steps; a
  framework and a build step would add a toolchain to maintain without making
  any of it clearer. The only external dependency is Razorpay's checkout, which
  has to come from their CDN because it opens their payment window.

  The one rule it must not break: **the browser never decides a booking is
  confirmed.** Razorpay's handler firing means the guest finished paying, not
  that we were told about it. Confirmation arrives by signed webhook, so this
  polls for it. Anything else would confirm rooms nobody paid for.
-->
<style>
  :root {
    --ink: #1e293b; --muted: #64748b; --line: #e2e8f0;
    --bg: #f8fafc; --card: #ffffff;
    --brand: #0f766e; --brand-dark: #115e59;
    /* What goes ON the brand colour. Computed by the server from the
       colour itself, never chosen by the hotel -- see branding.py. */
    --brand-ink: #fff;
    --warn-bg: #fffbeb; --warn: #92400e;
    --bad-bg: #fef2f2; --bad: #b91c1c;
    --good-bg: #ecfdf5; --good: #047857;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 64px; }
  header.prop { padding: 28px 0 18px; }
  header.prop h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  header.prop p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
  }
  h2 { font-size: 17px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; background: #fff; color: var(--ink);
  }
  header.prop img#propLogo { max-height: 56px; max-width: 220px; margin-bottom: 10px; display: block; }
  header.prop .tagline { margin: 2px 0 4px; font-size: 15px; color: #475569; }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }
  .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .row-4 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr 1fr 1fr; }
  @media (max-width: 560px) { .row-4 { grid-template-columns: 1fr 1fr; } }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 11px;
    padding: 12px 18px; background: var(--brand); color: var(--brand-ink); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--brand-dark); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); padding: 8px 0; font-weight: 500; }
  button.ghost:hover:not(:disabled) { background: transparent; color: var(--brand); }
  .full { width: 100%; }
  .room { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .room:first-of-type { border-top: 0; }
  .room img { width: 116px; height: 88px; object-fit: cover; border-radius: 10px; flex: 0 0 auto; background: #f1f5f9; }
  .room .grow { flex: 1; min-width: 0; }
  .room h3 { margin: 0 0 3px; font-size: 15px; }
  .room .amen { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
  .room .price { text-align: right; white-space: nowrap; }
  .room .price b { display: block; font-size: 17px; }
  .room .price span { color: var(--muted); font-size: 12px; }
  @media (max-width: 560px) {
    .room { flex-wrap: wrap; }
    .room img { width: 100%; height: 150px; }
    .room .price { text-align: left; width: 100%; }
  }
  .note { border-radius: 11px; padding: 12px 14px; font-size: 13.5px; margin: 0 0 14px; }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .note.good { background: var(--good-bg); color: var(--good); }
  .note.info { background: #f1f5f9; color: #475569; }
  .totals { display: flex; justify-content: space-between; padding: 9px 0; font-size: 14px; }
  .totals.grand { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 13px; font-size: 17px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .hide { display: none !important; }
  .spin {
    width: 17px; height: 17px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    vertical-align: -3px; margin-right: 8px; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; padding: 22px 0; }
  .big { font-size: 40px; line-height: 1; margin-bottom: 10px; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="prop">
    <img id="propLogo" alt="" hidden>
    <h1 id="propName" data-i18n="bookYourStay">Book your stay</h1>
    <p id="propTagline" class="tagline" hidden></p>
    <p id="propWhere"></p>
  </header>

  <div id="fatal" class="note bad hide"></div>

  <!-- 1. dates ------------------------------------------------------- -->
  <section id="stepSearch" class="card">
    <h2 data-i18n="whenStaying">When are you staying?</h2>
    <div class="row-4">
      <div><label for="arrival" data-i18n="checkIn">Check in</label><input type="date" id="arrival"></div>
      <div><label for="departure" data-i18n="checkOut">Check out</label><input type="date" id="departure"></div>
      <div><label for="adults" data-i18n="adults">Adults</label>
        <select id="adults"></select></div>
      <div><label for="children" data-i18n="children">Children</label>
        <select id="children"></select></div>
    </div>
    <p id="searchErr" class="note bad hide" style="margin:14px 0 0"></p>
    <button id="searchBtn" class="full" style="margin-top:16px" data-i18n="searchRooms">Search rooms</button>
  </section>

  <!-- 2. rooms ------------------------------------------------------- -->
  <section id="stepRooms" class="card hide">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <h2 id="roomsHead" style="margin:0" data-i18n="availableRooms">Available rooms</h2>
      <!-- Shown only when the platform has set display rates. Prices are
           converted for reading; the guest always pays in the hotel's own
           currency, and the page says so beside every converted figure. -->
      <label id="curWrap" class="hide" style="display:flex;align-items:center;gap:6px;margin:0;font-weight:500">
        <span data-i18n="showPricesIn">Show prices in</span>
        <select id="displayCur" style="width:auto;padding:6px 10px"></select>
      </label>
    </div>
    <div id="roomList"></div>
    <button class="ghost" data-back="search" data-i18n="changeDates">&larr; Change dates</button>
  </section>

  <!-- 3. guest ------------------------------------------------------- -->
  <section id="stepGuest" class="card hide">
    <h2 data-i18n="yourDetails">Your details</h2>
    <div id="pickSummary" class="note info"></div>
    <div style="margin-bottom:12px">
      <label for="gName" data-i18n="fullName">Full name</label>
      <input id="gName" autocomplete="name" data-i18n-ph="asOnId" placeholder="As on your ID">
    </div>
    <div class="row" style="margin-bottom:12px">
      <div><label for="gEmail" data-i18n="email">Email</label>
        <input id="gEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div><label for="gPhone" data-i18n="phone">Phone</label>
        <input id="gPhone" type="tel" autocomplete="tel" data-i18n-ph="phoneHint" placeholder="Mobile, with country code"></div>
    </div>
    <div style="margin-bottom:12px">
      <label for="gReq"><span data-i18n="specialRequests">Special requests</span> <span style="font-weight:400;color:#94a3b8" data-i18n="optional">(optional)</span></label>
      <input id="gReq" maxlength="1000" data-i18n-ph="requestsHint" placeholder="Late arrival, high floor…">
    </div>
    <p id="guestErr" class="note bad hide"></p>
    <button id="holdBtn" class="full" data-i18n="holdRoom">Hold this room</button>
    <p class="muted" style="margin:10px 0 0" data-i18n="holdExplain">
      We hold the room while you pay. Nothing is charged until you confirm.
    </p>
    <button class="ghost" data-back="rooms" data-i18n="chooseAnother">&larr; Choose another room</button>
  </section>

  <!-- 4. pay --------------------------------------------------------- -->
  <section id="stepPay" class="card hide">
    <h2 data-i18n="confirmPay">Confirm and pay</h2>
    <div id="holdTimer" class="note warn"></div>
    <div id="payLines"></div>
    <p id="payErr" class="note bad hide"></p>
    <button id="payBtn" class="full" data-i18n="payNow">Pay now</button>
    <p class="muted" style="margin:10px 0 0" data-i18n="razorpayNote">
      Payment is handled by Razorpay. We never see your card details.
    </p>
  </section>

  <!-- 5. confirming / done ------------------------------------------- -->
  <section id="stepDone" class="card hide">
    <div class="center">
      <div class="big" id="doneIcon">⏳</div>
      <h2 id="doneHead" style="margin-bottom:6px" data-i18n="confirming">Confirming your booking…</h2>
      <p id="doneBody" class="muted" style="max-width:420px;margin:0 auto"></p>
      <div id="doneRef" class="note good hide" style="margin-top:18px"></div>
    </div>
  </section>

  <p class="muted center" style="opacity:.75">
    Powered by MyGuest
  </p>
</div>

<script>
// ---------------------------------------------------------------------------
// Every word a guest reads, in one table per language.
//
// English is the only language shipped. Adding one is adding a table here
// with the same keys: the page picks it from ?lang=xx, or from the browser's
// language, and falls back to English for anything a table does not have, so
// a half-finished translation shows English rather than a raw key.
// ---------------------------------------------------------------------------
const STRINGS = {
  en: {
    bookYourStay: 'Book your stay', whenStaying: 'When are you staying?',
    checkIn: 'Check in', checkOut: 'Check out', adults: 'Adults', children: 'Children',
    searchRooms: 'Search rooms', searching: 'Searching…', availableRooms: 'Available rooms',
    showPricesIn: 'Show prices in', changeDates: '← Change dates',
    yourDetails: 'Your details', fullName: 'Full name', asOnId: 'As on your ID',
    email: 'Email', phone: 'Phone', phoneHint: 'Mobile, with country code',
    specialRequests: 'Special requests', optional: '(optional)',
    requestsHint: 'Late arrival, high floor…', holdRoom: 'Hold this room', holding: 'Holding…',
    holdExplain: 'We hold the room while you pay. Nothing is charged until you confirm.',
    chooseAnother: '← Choose another room', confirmPay: 'Confirm and pay', payNow: 'Pay now',
    tryAgain: 'Try again', openingPayment: 'Opening payment…',
    razorpayNote: 'Payment is handled by Razorpay. We never see your card details.',
    confirming: 'Confirming your booking…', select: 'Select',
    night: 'night', nights: 'nights', perNight: '/ night', sleeps: 'Sleeps {n}',
    to: 'to', total: 'Total', checkInFrom: 'Check-in from {t}',
    approx: '≈ {amount}', payIn: 'You pay in {cur}. Converted prices are approximate.',
    errNetwork: 'We could not reach the booking system. Please check your connection and try again.',
    errGeneric: 'Something went wrong. Please try again.', errShape: 'That did not look right.',
    errNights: 'Check-out must be at least one night after check-in.',
    errNone: 'Nothing is available for those dates. Please try a different stay.',
    errName: 'Please enter your full name.',
    errEmail: 'Please enter a valid email address — your confirmation goes there.',
    errPhone: 'Please enter a phone number the property can reach you on.',
    holdExpired: 'This hold has expired and the room has been released. Please search again.',
    heldFor: 'Your room is held for {time} more.',
    noGatewayHead: 'Online payment unavailable',
    noGatewayBody: 'This property has not switched on online payments yet, so no payment was taken and this booking is not confirmed. The property has your details and can take payment directly. Your reference is {ref}.',
    checkoutLoadFail: 'The payment window could not be loaded. Please disable any ad blocker and try again.',
    paymentNotDone: 'Payment was not completed. Your room is still held — you can try again.',
    paymentFailed: 'That payment did not go through. Your room is still held.',
    confirmedHead: 'Booking confirmed', confirmedBody: 'We have emailed the details to {email}.',
    paidConfirming: 'Your payment went through. Confirming the room now…',
    paidHead: 'Payment received',
    paidBody: 'Your payment went through, but we are still confirming the room. The property has your booking and will email you shortly. Please do not pay again.',
    yourReference: 'Your reference:', invalidLink: 'This booking link is not valid.',
  },
};
const params = new URLSearchParams(location.search);
const LANG = [params.get('lang'), (navigator.language || 'en').slice(0, 2)]
  .find((l) => l && STRINGS[l]) || 'en';
document.documentElement.lang = LANG;
function t(key, vars) {
  let s = (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key;
  for (const [k, v] of Object.entries(vars || {})) s = s.replace('{' + k + '}', v);
  return s;
}
function applyStrings() {
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
}
const LOCALE = navigator.language || 'en-IN';

// ---------------------------------------------------------------------------
// The property is taken from the path, never from a query parameter -- the same
// rule the API itself keeps. /book/559167 is the whole of the addressing.
// ---------------------------------------------------------------------------
const CODE = location.pathname.split('/').filter(Boolean).pop() || '';
const API = '/api/booking/public/' + encodeURIComponent(CODE);

const state = {
  prop: null, nights: 0, room: null,
  reservationId: null, paymentToken: null, expiresAt: null,
  order: null, timer: null, polls: 0,
  rates: null, displayCur: null, lastRooms: null,
};

const $ = (id) => document.getElementById(id);
const money = (n, cur) => new Intl.NumberFormat(LOCALE,
  { style: 'currency', currency: cur || 'INR', maximumFractionDigits: 0 })
  .format(Number(n));
const isoDate = (d) => d.toISOString().slice(0, 10);
const plural = (n) => `${n} ${t(n === 1 ? 'night' : 'nights')}`;

/** A price in the guest's chosen currency, for reading only.
 *  Rates are relative to one base (rates[X] = X per 1 base), so any property
 *  currency converts to any display currency through it. */
function approx(amount, cur) {
  const r = state.rates, to = state.displayCur;
  if (!r || !to || to === cur || !r[cur] || !r[to]) return '';
  return t('approx', { amount: money(Number(amount) / r[cur] * r[to], to) });
}

function show(step) {
  for (const s of ['Search', 'Rooms', 'Guest', 'Pay', 'Done']) {
    $('step' + s).classList.toggle('hide', s.toLowerCase() !== step);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function err(el, message) {
  const box = $(el);
  box.textContent = message;
  box.classList.toggle('hide', !message);
}

function busy(btn, on, label) {
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spin"></span>' + esc(label) : esc(label);
}

/** Every call goes through here so one place turns a failure into a sentence. */
async function call(path, options) {
  let resp;
  try {
    resp = await fetch(path, options);
  } catch {
    throw new Error(t('errNetwork'));
  }
  const body = await resp.json().catch(() => null);
  if (!resp.ok) {
    // FastAPI puts validation failures in a list and our own refusals in a
    // string; a guest should never see either shape, only the sentence.
    const d = body && body.detail;
    throw new Error(typeof d === 'string' ? d
      : Array.isArray(d) && d.length ? (d[0].msg || t('errShape'))
        : t('errGeneric'));
  }
  return body;
}

// --- 1. dates --------------------------------------------------------------

const validDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');

function initDates() {
  const tday = new Date();
  const plus = (n) => { const d = new Date(tday); d.setDate(d.getDate() + n); return d; };
  $('arrival').value = isoDate(plus(1));
  $('departure').value = isoDate(plus(3));
  $('arrival').min = isoDate(tday);
  $('departure').min = isoDate(plus(1));
  for (let i = 1; i <= 10; i++) {
    $('adults').insertAdjacentHTML('beforeend', `<option value="${i}">${i}</option>`);
  }
  for (let i = 0; i <= 10; i++) {
    $('children').insertAdjacentHTML('beforeend', `<option value="${i}">${i}</option>`);
  }
  $('adults').value = '2';
  $('children').value = '0';
  // A search handed over by the hotel's website widget. Only well-formed
  // values are taken; anything else leaves the defaults.
  if (validDate(params.get('arrival'))) $('arrival').value = params.get('arrival');
  if (validDate(params.get('departure'))) $('departure').value = params.get('departure');
  const a = +params.get('adults'), c = +params.get('children');
  if (a >= 1 && a <= 10) $('adults').value = String(a);
  if (c >= 0 && c <= 10 && params.has('children')) $('children').value = String(c);
  $('arrival').addEventListener('change', () => {
    // Keep checkout after check-in without silently overriding a real choice.
    if ($('departure').value <= $('arrival').value) {
      const d = new Date($('arrival').value);
      d.setDate(d.getDate() + 1);
      $('departure').value = isoDate(d);
    }
    $('departure').min = $('arrival').value;
  });
}

async function search() {
  err('searchErr', '');
  const arrival = $('arrival').value, departure = $('departure').value;
  if (!arrival || !departure || departure <= arrival) {
    return err('searchErr', t('errNights'));
  }
  busy($('searchBtn'), true, t('searching'));
  try {
    const q = new URLSearchParams({
      arrival, departure,
      adults: $('adults').value, children: $('children').value,
    });
    const data = await call(`${API}/availability?${q}`);
    state.prop = data.property;
    state.nights = data.nights;
    paintProperty(data.property);
    paintCurrencies(data.property.currency);
    paintRooms(data);
    show('rooms');
  } catch (e) {
    err('searchErr', e.message);
  } finally {
    busy($('searchBtn'), false, t('searchRooms'));
  }
}

function paintProperty(p) {
  $('propName').textContent = p.name;
  const where = [p.city, p.country].filter(Boolean).join(', ');
  $('propWhere').textContent = where
    + (p.checkin_time ? ` · ${t('checkInFrom', { t: p.checkin_time })}` : '');
  document.title = t('bookYourStay') + ' · ' + p.name;
  paintBranding(p.branding || {});
}

/** The currency picker: the property's own currency plus whatever the
 *  platform has rates for. Hidden when there are no rates to convert with. */
function paintCurrencies(own) {
  const r = state.rates;
  const codes = r ? Object.keys(r).filter((c) => c !== own).sort() : [];
  $('curWrap').classList.toggle('hide', !codes.length);
  if (!codes.length) return;
  const sel = $('displayCur');
  sel.innerHTML = [own, ...codes].map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = state.displayCur && [own, ...codes].includes(state.displayCur) ? state.displayCur : own;
  state.displayCur = sel.value;
}

/** Make the page look like the hotel rather than like the platform.
 *
 *  Everything here is set as a property or as textContent, never by building
 *  markup: this is the one part of the page fed entirely by values a tenant
 *  typed, and the room list next door already learned to run every such
 *  string through esc().
 *
 *  The colour is trusted only as far as the server validated it -- six hex
 *  digits, checked again by a database constraint, and paired with a text
 *  colour the server computed for contrast. The page never picks the ink
 *  itself, because "white on the brand colour" is the assumption that makes
 *  a pale-gold button invisible.
 */
function paintBranding(b) {
  state.brand = b;
  const root = document.documentElement;
  if (b.brand_color) {
    root.style.setProperty('--brand', b.brand_color);
    root.style.setProperty('--brand-dark', shade(b.brand_color, 0.82));
    root.style.setProperty('--brand-ink', b.ink_on_brand || '#fff');
  }
  const logo = $('propLogo');
  if (b.logo_url) {
    logo.src = b.logo_url;
    logo.alt = '';           // decorative: the name is right beside it
    logo.hidden = false;
  } else {
    logo.hidden = true;
  }
  const tagline = $('propTagline');
  if (b.tagline) {
    tagline.textContent = b.tagline;
    tagline.hidden = false;
  } else {
    tagline.hidden = true;
  }
}

/** A darker shade of a hex colour, for the hover state.
 *
 *  Multiplying each channel keeps the hue, which a fixed darker colour would
 *  not -- a maroon hotel hovering to the platform's teal would look broken.
 */
function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map((v) => Math.max(0, Math.min(255, Math.round(v * factor))));
  return '#' + ch.map((v) => v.toString(16).padStart(2, '0')).join('');
}

function paintRooms(data) {
  state.lastRooms = data;
  const nights = data.nights;
  const cur = data.property.currency;
  $('roomsHead').textContent =
    `${plural(nights)} · ${fmtDate(data.arrival)} ${t('to')} ${fmtDate(data.departure)}`;
  const list = $('roomList');
  // Only what can actually be sold. A room type with nothing left is not an
  // offer, and showing it greyed out just invites a click that fails.
  const sellable = (data.room_types || []).filter((r) => r.available > 0);
  if (!sellable.length) {
    list.innerHTML = `<p class="note info">${esc(t('errNone'))}</p>`;
    return;
  }
  const converted = state.displayCur && state.displayCur !== cur;
  list.innerHTML = sellable.map((r, i) => `
    <div class="room">
      ${r.photos && r.photos.length
        ? `<img src="${esc(r.photos[0].url)}" alt="${esc(r.name)}" loading="lazy">`
        : '<div class="room-noimg" style="width:116px;height:88px;border-radius:10px;background:#f1f5f9"></div>'}
      <div class="grow">
        <h3>${esc(r.name)}</h3>
        <p class="amen">${esc([
          r.bed_setup, r.max_occupancy ? t('sleeps', { n: r.max_occupancy }) : '',
          ...(r.amenities || []).slice(0, 3),
        ].filter(Boolean).join(' · '))}</p>
        <button data-pick="${i}">${esc(t('select'))}</button>
      </div>
      <div class="price">
        <b>${money(r.total, cur)}</b>
        <span>${money(r.nightly_from, cur)} ${esc(t('perNight'))}</span>
        ${converted ? `<span style="display:block">${esc(approx(r.total, cur))}</span>` : ''}
      </div>
    </div>`).join('')
    + (converted ? `<p class="muted" style="margin:10px 0 0">${esc(t('payIn', { cur }))}</p>` : '');
  list.querySelectorAll('[data-pick]').forEach((b) => {
    b.addEventListener('click', () => pick(sellable[+b.dataset.pick]));
  });
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (s) => new Date(s + 'T00:00:00').toLocaleDateString(LOCALE,
  { day: 'numeric', month: 'short' });

// --- 3. guest --------------------------------------------------------------

function pick(room) {
  state.room = room;
  const cur = state.prop.currency;
  const conv = approx(room.total, cur);
  $('pickSummary').innerHTML =
    `<b>${esc(room.name)}</b> · ${esc(plural(state.nights))}`
    + ` · ${money(room.total, cur)}${conv ? ` <span class="muted">(${esc(conv)})</span>` : ''}`;
  err('guestErr', '');
  show('guest');
}

async function hold() {
  err('guestErr', '');
  const name = $('gName').value.trim();
  const email = $('gEmail').value.trim();
  const phone = $('gPhone').value.trim();
  if (name.length < 2) return err('guestErr', t('errName'));
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    return err('guestErr', t('errEmail'));
  }
  if (phone.replace(/\D/g, '').length < 5) {
    return err('guestErr', t('errPhone'));
  }

  busy($('holdBtn'), true, t('holding'));
  try {
    const held = await call(`${API}/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        arrival: $('arrival').value,
        departure: $('departure').value,
        room_type_code: state.room.code,
        adults: +$('adults').value,
        children: +$('children').value,
        guest: { full_name: name, email, phone },
        special_requests: $('gReq').value.trim() || null,
      }),
    });
    state.reservationId = held.reservation_id;
    // Handed over once and never again. Kept only in memory: a reload loses
    // it, which is the correct trade for not leaving a payment capability in
    // somebody's browser storage.
    state.paymentToken = held.payment_token;
    state.expiresAt = new Date(held.expires_at);
    paintPay(held);
    startCountdown();
    show('pay');
  } catch (e) {
    err('guestErr', e.message);
  } finally {
    busy($('holdBtn'), false, t('holdRoom'));
  }
}

// --- 4. pay ----------------------------------------------------------------

function paintPay(held) {
  const cur = held.currency;
  const conv = approx(held.total, cur);
  $('payLines').innerHTML = `
    <div class="totals"><span>${esc(held.room_type)}</span><span>${esc(held.reservation_number)}</span></div>
    <div class="totals"><span>${fmtDate(held.arrival)} → ${fmtDate(held.departure)}</span>
      <span>${esc(plural(held.nights))}</span></div>
    <div class="totals grand"><span>${esc(t('total'))}</span><span>${money(held.total, cur)}</span></div>
    ${conv ? `<p class="muted" style="margin:4px 0 0;text-align:right">${esc(conv)} · ${esc(t('payIn', { cur }))}</p>` : ''}`;
}

function startCountdown() {
  clearInterval(state.timer);
  const tick = () => {
    const left = Math.max(0, state.expiresAt - Date.now());
    if (left === 0) {
      clearInterval(state.timer);
      $('holdTimer').textContent = t('holdExpired');
      $('payBtn').disabled = true;
      return;
    }
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    $('holdTimer').textContent = t('heldFor', { time: `${m}:${String(s).padStart(2, '0')}` });
  };
  tick();
  state.timer = setInterval(tick, 1000);
}

async function pay() {
  err('payErr', '');
  busy($('payBtn'), true, t('openingPayment'));
  try {
    const order = await call(`${API}/pay`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reservation_id: state.reservationId,
        payment_token: state.paymentToken,
      }),
    });
    state.order = order;

    // An empty key means the property has no live gateway: the order is a
    // stand-in and no money will move. Saying so beats opening a checkout that
    // cannot work, and beats pretending the booking is done.
    if (!order.key_id) {
      clearInterval(state.timer);
      // Not "Test mode" -- that phrase belongs to Razorpay, and a property
      // using rzp_test_ keys IS in Razorpay's test mode while reaching this
      // branch would mean something quite different: no gateway switched on
      // at all.
      finish('warn', t('noGatewayHead'), t('noGatewayBody', { ref: order.reservation_number }));
      return;
    }

    await loadRazorpay();
    openCheckout(order);
  } catch (e) {
    err('payErr', e.message);
    busy($('payBtn'), false, t('payNow'));
  }
}

function loadRazorpay() {
  if (window.Razorpay) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://checkout.razorpay.com/v1/checkout.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error(t('checkoutLoadFail')));
    document.head.appendChild(s);
  });
}

function openCheckout(order) {
  const rzp = new window.Razorpay({
    key: order.key_id,
    order_id: order.order_id,
    amount: Math.round(Number(order.amount) * 100),
    currency: order.currency,
    name: state.prop.name,
    description: `${state.room.name} · ${plural(state.nights)}`,
    prefill: {
      name: $('gName').value.trim(),
      email: $('gEmail').value.trim(),
      contact: $('gPhone').value.trim(),
    },
    // The gateway's own window, in the hotel's colour. A guest who has
    // just read the hotel's page should not hand over a card on one
    // that suddenly belongs to somebody else.
    theme: { color: (state.brand && state.brand.brand_color) || '#0f766e' },
    // Fires when the guest finishes paying. It does NOT mean we have been
    // told -- the signed webhook is the only thing that confirms a booking,
    // so this starts watching for it rather than declaring success.
    handler: () => {
      clearInterval(state.timer);
      show('done');
      pollStatus();
    },
    modal: {
      ondismiss: () => {
        busy($('payBtn'), false, t('payNow'));
        err('payErr', t('paymentNotDone'));
      },
    },
  });
  rzp.on('payment.failed', (e) => {
    busy($('payBtn'), false, t('tryAgain'));
    err('payErr', (e && e.error && e.error.description) || t('paymentFailed'));
  });
  rzp.open();
  busy($('payBtn'), false, t('payNow'));
}

// --- 5. confirming ---------------------------------------------------------

/**
 * Watch for the webhook to land.
 *
 * Backed off and bounded. A callback normally arrives within a second or two,
 * but "normally" is not "always", and a page that polls forever is a page that
 * hammers the API from every abandoned tab. After about a minute it stops and
 * says something true: the money is taken and the property has the booking,
 * even if this page never saw it flip.
 */
async function pollStatus() {
  const delays = [1000, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 8000, 10000, 15000];
  for (const wait of delays) {
    try {
      const q = new URLSearchParams({ payment_token: state.paymentToken });
      const s = await call(
        `${API}/booking/${encodeURIComponent(state.reservationId)}?${q}`);
      if (s.status === 'confirmed') {
        return finish('good', t('confirmedHead'),
          t('confirmedBody', { email: $('gEmail').value.trim() }),
          s.reservation_number);
      }
      if (s.paid) {
        $('doneBody').textContent = t('paidConfirming');
      }
    } catch {
      // A failed poll is not a failed booking. Keep waiting; the fallback
      // below is what the guest sees if it never resolves.
    }
    await new Promise((r) => setTimeout(r, wait));
  }
  finish('warn', t('paidHead'), t('paidBody'), state.order && state.order.reservation_number);
}

function finish(kind, head, body, ref) {
  show('done');
  $('doneIcon').textContent = kind === 'good' ? '✅' : kind === 'warn' ? '⚠️' : 'ℹ️';
  $('doneHead').textContent = head;
  $('doneBody').textContent = body;
  const box = $('doneRef');
  box.className = 'note ' + (kind === 'good' ? 'good' : 'warn');
  box.classList.toggle('hide', !ref);
  if (ref) box.innerHTML = esc(t('yourReference')) + ' <b>' + esc(ref) + '</b>';
}

// --- boot ------------------------------------------------------------------

async function boot() {
  applyStrings();
  if (!CODE || !/^[A-Za-z0-9-]{3,40}$/.test(CODE)) {
    $('fatal').textContent = t('invalidLink');
    $('fatal').classList.remove('hide');
    $('stepSearch').classList.add('hide');
    return;
  }
  initDates();

  // Who this page belongs to, before the guest has chosen anything. Branding
  // that only arrives after a search is branding the guest sees second, on
  // the screen where it matters least -- so the hotel's name, line and colour
  // are fetched on load and painted before the form is touched.
  //
  // A failure here is not fatal: the page still works in the platform's own
  // colours, and the search that follows will paint it properly. Refusing to
  // show a booking form because a logo could not be fetched would be the
  // wrong trade by a distance.
  call(API).then(paintProperty).catch(() => {});
  // Display rates for the currency picker. Optional in the same way: without
  // them the picker simply stays hidden.
  call(`${API}/display-rates`).then((r) => {
    if (r && r.rates && Object.keys(r.rates).length) state.rates = r.rates;
  }).catch(() => {});

  $('searchBtn').addEventListener('click', search);
  $('holdBtn').addEventListener('click', hold);
  $('payBtn').addEventListener('click', pay);
  $('displayCur').addEventListener('change', () => {
    state.displayCur = $('displayCur').value;
    if (state.lastRooms) paintRooms(state.lastRooms);
  });
  document.querySelectorAll('[data-back]').forEach((b) =>
    b.addEventListener('click', () => show(b.dataset.back)));

  // Warn before losing a live hold. Browsers show their own wording; the only
  // thing that matters is that the prompt happens at all.
  window.addEventListener('beforeunload', (e) => {
    if (state.reservationId && !$('stepPay').classList.contains('hide')) {
      e.preventDefault(); e.returnValue = '';
    }
  });

  // Arrived from the hotel's website widget with dates chosen: search at once.
  if (validDate(params.get('arrival')) && validDate(params.get('departure'))) search();
}

boot();
</script>
</body>
</html>
