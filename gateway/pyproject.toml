[project]
name = "chirala-gateway"
version = "0.1.0"
description = "API gateway / BFF: routes frontend requests to IAM and booking-core."
requires-python = ">=3.12"
dependencies = [
    # For the request-id middleware and log format the services share, so an
    # id minted here is the one every downstream log line carries.
    "chirala-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.uv.sources]
chirala-common = { path = "../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway_app"]
