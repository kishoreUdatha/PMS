# Continuous integration.
#
# Until this file the repository had no CI at all: every guard in tests/ and
# every row-security suite ran only when somebody remembered to, and the
# DB-backed suites skipped to a green exit whenever the database was not
# wired up. Three jobs, independent so one failing does not hide the others:
#
#   python-static  lint + the source-parsing isolation checks (no services)
#   python-db      a real Postgres 16, migrated exactly as compose does it,
#                  then every suite that needs only a database -- in STRICT
#                  mode, so a skip for a missing database is a failure
#   frontend       install and build the React app
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run's result moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pinned: ruff's default rule set and its findings change between
  # releases, and a lint gate that moves on its own is not a gate.
  RUFF_VERSION: "0.16.9"

jobs:
  python-static:
    name: Python lint + isolation guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install services and shared lib
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv \
            -e libs/common -e services/iam -e services/booking-core \
            -e services/finance -e gateway pytest

      # The rule selection lives in ruff.toml (a baseline that passes today;
      # see the comment there), so `make lint` and CI agree.
      - name: Ruff
        run: uvx "ruff@${RUFF_VERSION}" check services libs gateway tests conftest.py

      # Non-blocking for now: mypy stops before checking anything, on the
      # three services' identically-named `alembic/env.py` modules. Kept as a
      # step so the output is one click away for whoever takes that on; drop
      # continue-on-error once it passes.
      - name: Mypy (informational)
        continue-on-error: true
        run: uvx mypy services libs gateway

      # These parse source rather than call it, so they need no database and
      # can never skip -- between them, the tenant-isolation and platform
      # separation story. Same set as `make test-guards test-platform`.
      - name: Isolation guards
        run: >
          pytest tests/test_tenant_guards.py tests/test_platform_separation.py
          tests/test_platform_operations.py tests/test_observability.py

  python-db:
    name: Python suites against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms_dev_password
          POSTGRES_DB: chirala_pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms -d chirala_pms"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # booking-core's rate limiter uses Redis and fails open without it;
      # provided so the in-process integration tests run the real path.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: pms
      PGPASSWORD: pms_dev_password
      PGDATABASE: chirala_pms
      # Two logins, as in compose: the OWNER migrates and grants; the RUNTIME
      # login (no ownership, no BYPASSRLS) is what the app and the row-
      # security suites connect as. The RLS tests compare the two, which is
      # the only way to show a policy filters anything.
      IAM_MIGRATION_DATABASE_URL: postgresql+psycopg://pms:pms_dev_password@localhost:5432/chirala_pms
      FINANCE_MIGRATION_DATABASE_URL: postgresql+psycopg://pms:pms_dev_password@localhost:5432/chirala_pms
      BOOKING_MIGRATION_DATABASE_URL: postgresql+psycopg://pms:pms_dev_password@localhost:5432/chirala_pms
      IAM_DATABASE_URL: postgresql+psycopg://pms_app:pms_app_ci_password@localhost:5432/chirala_pms
      FINANCE_DATABASE_URL: postgresql+psycopg://pms_app:pms_app_ci_password@localhost:5432/chirala_pms
      BOOKING_DATABASE_URL: postgresql+psycopg://pms_app:pms_app_ci_password@localhost:5432/chirala_pms
      APP_DB_USER: pms_app
      APP_DB_PASSWORD: pms_app_ci_password
      # The in-process integration test calls the services as a service.
      SERVICE_TOKEN: ci-service-token
      REDIS_URL: redis://localhost:6379/0
      # Nothing talks to the real channel manager from CI.
      CHANNEX_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install services and shared lib
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv \
            -e libs/common -e services/iam -e services/booking-core \
            -e services/finance -e gateway pytest

      # What docker-entrypoint-initdb.d does for the compose Postgres:
      # extensions, schemas, the runtime role's defaults.
      - name: Bootstrap database
        run: psql -v ON_ERROR_STOP=1 -q -f infra/postgres/init/01_init.sql

      # The same script the compose `migrate` service runs: iam -> finance
      # -> booking-core (booking-core's migrations reference finance's
      # tables), then the runtime login and its grants. Running it here is
      # also what tests that ordering on every change.
      - name: Migrate
        env:
          SERVICES_ROOT: ${{ github.workspace }}
        run: ./infra/migrate/migrate.sh

      # REQUIRE_STACK=1: a test that skips because it cannot reach the
      # database FAILS instead (see conftest.py), and the row-security suites
      # seed two tenants rather than skipping for want of them. A green run
      # here means they ran.
      #
      # Left out, and why:
      # * test_money_invariants.py, test_operational_flows.py -- they drive
      #   the RUNNING HTTP stack against one particular property's real data
      #   (TEST_PROPERTY, dated business days), which a fresh CI database
      #   does not have. `make test-money` / `make test-flows` run them, in
      #   strict mode, against a stack that does.
      # * test_full_loop_checkout_bills_folio -- fails on the current code,
      #   independent of CI: it expects checkout to post the room charge,
      #   which orchestration.checkout_with_billing deliberately stopped
      #   doing (the night audit posts each night). Needs a decision on the
      #   test, not a CI workaround; deselected so it is tracked in one
      #   place rather than turning every run red.
      - name: Tests (strict)
        env:
          REQUIRE_STACK: "1"
        run: >
          pytest services tests
          --ignore=tests/test_money_invariants.py
          --ignore=tests/test_operational_flows.py
          --deselect tests/test_integration_full_loop.py::test_full_loop_checkout_bills_folio

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Non-blocking until the frontend's ESLint config lands (another
      # change in flight adds it; ESLint 9 exits 2 without an
      # eslint.config.js). Make it blocking by deleting continue-on-error.
      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
